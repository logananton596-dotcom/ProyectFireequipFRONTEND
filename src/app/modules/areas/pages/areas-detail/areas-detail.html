<div class="area-detail-container">
  <div class="mb-3">
    <button class="btn btn-outline-secondary" (click)="volver()">
      <i class="bi bi-arrow-left"></i>
      Volver
    </button>
  </div>

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  }

  @if (!loading() && area()) {
    <div class="card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">
          <i class="bi bi-building"></i>
          {{ area()?.nombre }}
        </h4>
        <div>
          @if (isAdmin()) {
            <button class="btn btn-primary me-2" (click)="editar()">
              <i class="bi bi-pencil"></i>
              Editar
            </button>
            <button class="btn btn-danger" (click)="eliminar()">
              <i class="bi bi-trash"></i>
              Eliminar
            </button>
          }
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <table class="table table-borderless">
              <tr>
                <th width="40%">ID:</th>
                <td><strong>{{ area()?.id }}</strong></td>
              </tr>
              <tr>
                <th>Nombre:</th>
                <td>{{ area()?.nombre }}</td>
              </tr>
            </table>
          </div>
          <div class="col-md-6">
            <table class="table table-borderless">
              <tr>
                <th width="40%">Encargado:</th>
                <td>{{ area()?.encargado }}</td>
              </tr>
              <tr>
                <th>Teléfono:</th>
                <td>{{ area()?.telefono || 'N/A' }}</td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  }
</div>
