<div class="register-card">
  <div class="register-header">
    <h2>Crear Cuenta</h2>
    <p>Regístrese para acceder al sistema</p>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" formControlName="username" class="form-control"
             [class.is-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="password" class="form-control"
             [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control"
             [class.is-invalid]="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
      <div class="invalid-feedback" *ngIf="registerForm.hasError('mismatch')">
        Las contraseñas no coinciden
      </div>
    </div>

    <button type="submit" class="btn btn-register" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      Registrarse
    </button>

    <div class="text-center mt-3">
      <a routerLink="/auth/login">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
  </form>
</div>
