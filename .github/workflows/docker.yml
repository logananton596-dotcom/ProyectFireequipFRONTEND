name: Build and Push Frontend Docker Image

on:
  push:
    branches: [ "MODULES" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and Build
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --configuration=production

      # Configura tus secretos (DOCKER_USERNAME y DOCKER_PASSWORD) en Settings de este nuevo repo 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Usamos la acción oficial de Docker para compilar y empujar de forma segura
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fireequip-frontend:latest
